services:
  - type: web
    name: jan-sahayak-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: ALLOWED_ORIGINS
        value: https://*.vercel.app,http://localhost:5173,http://localhost:8005
      - key: GEMINI_API_KEY
        sync: false
